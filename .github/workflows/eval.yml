name: eval
on:
  push:
    tags:
      - "eval-*"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eval
  cancel-in-progress: false
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Run eval
        run: |
          mkdir -p resultados
          npm run --silent eval > "resultados/eval-$(date -u +%Y-%m-%dT%H-%M-%SZ).md"
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_VECTORIZE_INDEX: ${{ secrets.CF_VECTORIZE_INDEX }}
      - name: Job summary
        run: cat resultados/*.md | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: resultados
          path: resultados/
          if-no-files-found: error
  publicar:
    needs: eval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # only this job can write; it never sees the Cloudflare secrets
    permissions:
      contents: write
    concurrency:
      group: resultados
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: resultados
          path: ${{ runner.temp }}/resultados
      - name: Publish results branch
        run: |
          out="$RUNNER_TEMP/resultados"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin resultados >/dev/null; then
            # keep earlier results: build on top of the existing branch (fast-forward push)
            git fetch --depth=1 origin resultados
            git checkout -f -B resultados-tmp FETCH_HEAD
          else
            git checkout --orphan resultados-tmp
            git rm -rf --quiet .
            git clean -ffdx --quiet
          fi
          mkdir -p resultados
          cp "$out"/* resultados/
          git add resultados
          git commit -m "eval: resultados de $GITHUB_RUN_ID"
          git push origin HEAD:resultados
