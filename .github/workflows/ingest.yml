name: ingest
on:
  schedule:
    - cron: "17 3 * * *"
  push:
    tags:
      - "reindex-*" # re-embeds every entry (REINDEX=1) after the Vectorize index was recreated
  workflow_dispatch:
    inputs:
      force_prune:
        description: "Forzar la poda aunque borre más de la mitad del índice"
        type: boolean
        default: false
      reindex:
        description: "Reindexar: re-embeber todas las entradas (tras recrear el índice Vectorize)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsx src/ingest/run.ts
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_VECTORIZE_INDEX: ${{ secrets.CF_VECTORIZE_INDEX }}
          FORCE_PRUNE: ${{ inputs.force_prune && '1' || '' }}
          REINDEX: ${{ (startsWith(github.ref, 'refs/tags/reindex-') || inputs.reindex) && '1' || '' }}
