name = "catalogo-mcp-busqueda"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

[vars]
# Pasarela (explorar/llamar): "1" la activa. Se publica apagada; ver README > Despliegue.
GATEWAY_ENABLED = "0"
# Ids del catálogo bloqueados en la pasarela (separados por comas); se tratan como desconocidos.
GATEWAY_BLOQUEADOS = ""

[[d1_databases]]
binding = "DB"
database_name = "catalogo-mcp"
database_id = "9d719b2d-8f41-4a22-870f-f68c935fdaa2"

[[vectorize]]
binding = "VECTORS"
index_name = "catalogo-mcp"

[ai]
binding = "AI"

[[r2_buckets]]
binding = "LOGS"
bucket_name = "catalogo-mcp-logs"

[[ratelimits]]
name = "LIMITER"
namespace_id = "48291"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "LIMITER_EXPLORAR"
namespace_id = "48292"

  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "LIMITER_LLAMAR"
namespace_id = "48293"

  [ratelimits.simple]
  limit = 10
  period = 60

[[durable_objects.bindings]]
name = "SESIONES"
class_name = "SesionDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SesionDO"]
