name = "catalogo-mcp-busqueda"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "catalogo-mcp"
database_id = "9d719b2d-8f41-4a22-870f-f68c935fdaa2"

[[vectorize]]
binding = "VECTORS"
index_name = "catalogo-mcp"

[ai]
binding = "AI"

[[r2_buckets]]
binding = "LOGS"
bucket_name = "catalogo-mcp-logs"

[[ratelimits]]
name = "LIMITER"
namespace_id = "48291"

  [ratelimits.simple]
  limit = 30
  period = 60
